# egress redline rule set -- the single source shared by CAP egress and the LED evidence exit (config points to it, redact consumes it).
# Each entry = one named regex; redact replaces the whole match with [REDACTED:<category>:<name>].
# Over-redaction is the safe side (better to drop too much); add new rules here alone, do not scatter them across the code.

[[secret]]
name = "aws_access_key_id"
pattern = '''AKIA[0-9A-Z]{16}'''

[[secret]]
name = "private_key_block"
pattern = '''(?s)-----BEGIN [A-Z0-9 ]*PRIVATE KEY-----.*?-----END [A-Z0-9 ]*PRIVATE KEY-----'''

[[secret]]
name = "github_token"
pattern = '''gh[posru]_[A-Za-z0-9]{20,}'''

[[secret]]
name = "slack_token"
pattern = '''xox[abprs]-[A-Za-z0-9-]{10,}'''

[[secret]]
name = "bearer_token"
pattern = '''(?i)bearer\s+[A-Za-z0-9._-]{20,}'''

[[secret]]
name = "api_key_assignment"
pattern = '''(?i)(api[_-]?key|secret|token|password)\s*[:=]\s*['"]?[A-Za-z0-9._\-/+]{12,}'''

[[secret]]
name = "anthropic_key"
pattern = '''sk-ant-[A-Za-z0-9_\-]{16,}'''

[[secret]]
name = "openai_style_key"
pattern = '''\bsk-(?:proj-)?[A-Za-z0-9_\-]{20,}'''

[[secret]]
name = "router_key"
pattern = '''\brk_(?:live_|test_)?[A-Za-z0-9]{16,}'''

[[secret]]
name = "env_secret_assignment"
# any *_KEY / *_TOKEN / *_SECRET / *_PASSWORD / *_CREDENTIAL(S) name assigned a value: shell, export,
# PowerShell $env:, .env, YAML/JSON ("name": "value"). Catches R2_KEY=, RAILWAY_TOKEN=, AWS_SECRET_ACCESS_KEY=.
pattern = '''(?i)\b[A-Z0-9_]*(?:KEY|TOKEN|SECRET|PASSWORD|PASSWD|CREDENTIALS?)["']?\s*[:=]\s*["']?[^\s"',;]{8,}'''

[[secret]]
name = "credentialed_connection_uri"
pattern = '''(?i)\b(?:postgres(?:ql)?|mysql|mariadb|mongodb(?:\+srv)?|redis|rediss)://[^\s/:@]+:[^\s/@]+@[^\s]+'''

[[secret]]
name = "jwt"
pattern = '''\beyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}\b'''

[[pii]]
name = "email"
pattern = '''[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}'''

[[pii]]
name = "ssn"
pattern = '''(?<!\d)\d{3}-\d{2}-\d{4}(?!\d)'''

[[pii]]
name = "us_phone"
pattern = '''(?<!\d)(\+?1[-.\s]?)?\(?\d{3}\)?[-.\s]\d{3}[-.\s]\d{4}(?!\d)'''

[[pii]]
name = "credit_card"
pattern = '''(?<!\d)(?:\d[ -]?){13,16}(?!\d)'''
