name: WMS AutoHarness gates

on:
  push:
    branches:
      - "wms/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-full:
    name: Linux full suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test runner
        run: python -m pip install --upgrade pytest
      - name: Run full suite
        run: python -m pytest -q

  windows-security:
    name: Windows security and global gates
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test runner
        run: python -m pip install --upgrade pytest
      - name: Run hardened security suite
        run: python -m pytest -q tests/security
